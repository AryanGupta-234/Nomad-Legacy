name: Fix Lyrics viewport layout and chrome layering

on:
  push:
    branches: [agent/nomad-vnext-foundation]

permissions:
  contents: write

jobs:
  lyrics-layout:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/nomad-vnext-foundation

      - name: Apply viewport layout correction
        env:
          LYRICS_LAYOUT_CSS: |
            /* NOMAD Lyrics v4 — viewport-safe layout correction.
               Existing markup, player, navigation and lyric behavior stay intact. */
            .lyrics-panel.fullscreen{
              --lyrics-header-h:72px;
              --lyrics-player-safe:112px;
              position:fixed;
              inset:0;
              width:100%;
              height:100dvh;
              min-height:100vh;
              overflow:hidden;
              z-index:1000;
              display:flex;
              flex-direction:column;
              isolation:isolate;
              background:#05070a;
            }
            .lyrics-panel.fullscreen .lyrics-panel-header{
              flex:0 0 var(--lyrics-header-h);
              min-height:var(--lyrics-header-h);
              height:var(--lyrics-header-h);
              position:relative;
              z-index:30;
              display:flex;
              align-items:center;
              padding:0 24px;
              background:rgba(5,7,10,.96);
              border-bottom:1px solid rgba(255,255,255,.08);
              box-shadow:0 10px 35px rgba(0,0,0,.24);
              backdrop-filter:blur(24px) saturate(150%);
              -webkit-backdrop-filter:blur(24px) saturate(150%);
            }
            .lyrics-panel.fullscreen .lyrics-panel-body-row{
              flex:1 1 auto;
              min-height:0;
              height:auto;
              display:grid;
              grid-template-columns:minmax(0,1fr) minmax(320px,360px);
              overflow:hidden;
              position:relative;
              z-index:1;
            }
            .lyrics-panel.fullscreen .lyrics-panel-inner{
              min-width:0;
              min-height:0;
              width:100%;
              max-width:none;
              height:100%;
              overflow-y:auto;
              overflow-x:hidden;
              padding:24px clamp(28px,5vw,76px) calc(var(--lyrics-player-safe) + env(safe-area-inset-bottom,0px));
              margin:0;
              overscroll-behavior:contain;
              scroll-padding-top:18px;
              scroll-padding-bottom:calc(var(--lyrics-player-safe) + 24px);
            }
            .lyrics-panel.fullscreen .lyrics-panel-inner::-webkit-scrollbar{width:8px;}
            .lyrics-panel.fullscreen .lyrics-panel-inner::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:99px;}
            .lyrics-panel.fullscreen .lyrics-pinned-top{
              position:sticky;
              top:0;
              z-index:20;
              margin:0 0 24px;
              padding:14px clamp(18px,3vw,34px) 12px;
              background:linear-gradient(180deg,rgba(6,8,12,.98),rgba(6,8,12,.88));
              border:1px solid rgba(255,255,255,.08);
              border-radius:0 0 16px 16px;
              box-shadow:0 14px 30px -24px rgba(0,0,0,.9);
              backdrop-filter:blur(22px) saturate(150%);
              -webkit-backdrop-filter:blur(22px) saturate(150%);
            }
            .lyrics-panel.fullscreen .lyrics-artist-rail,
            .lyrics-panel.fullscreen .lyrics-search-row,
            .lyrics-panel.fullscreen .lyrics-tabs{
              max-width:860px;
              margin-left:auto;
              margin-right:auto;
            }
            .lyrics-panel.fullscreen .lyrics-artist-rail{margin-bottom:16px;}
            .lyrics-panel.fullscreen .lyrics-search-row{margin-bottom:16px;}
            .lyrics-panel.fullscreen .lyrics-tabs{margin-bottom:22px;}
            .lyrics-panel.fullscreen .lyrics-lines,
            .lyrics-panel.fullscreen .lyrics-content,
            .lyrics-panel.fullscreen .lyrics-plain{
              min-width:0;
            }
            .lyrics-panel.fullscreen .lyrics-line{
              max-width:860px;
              margin-left:auto;
              margin-right:auto;
              scroll-margin-top:150px;
              scroll-margin-bottom:calc(var(--lyrics-player-safe) + 32px);
            }
            .lyrics-panel.fullscreen .lyrics-fs-sidebar{
              min-width:0;
              width:auto;
              height:100%;
              max-height:none;
              overflow-y:auto;
              overflow-x:hidden;
              padding:28px 24px calc(var(--lyrics-player-safe) + env(safe-area-inset-bottom,0px));
              background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,.012));
              border-left:1px solid rgba(255,255,255,.08);
              overscroll-behavior:contain;
              scrollbar-gutter:stable;
            }
            .lyrics-panel.fullscreen .lyrics-fs-sidebar::-webkit-scrollbar{width:7px;}
            .lyrics-panel.fullscreen .lyrics-fs-sidebar::-webkit-scrollbar-thumb{background:rgba(255,255,255,.10);border-radius:99px;}
            .lyrics-panel.fullscreen .lyrics-fs-sidebar .sidebar-artist-panel{
              position:sticky;
              top:0;
              max-height:none;
              margin:0;
              overflow:hidden;
            }
            body:has(.lyrics-panel.fullscreen){overflow:hidden;}
            body:has(.lyrics-panel.fullscreen) .player-bar,
            body:has(.lyrics-panel.fullscreen) .player-container,
            body:has(.lyrics-panel.fullscreen) .bottom-player{
              z-index:1200;
            }
            @media (max-width:900px){
              .lyrics-panel.fullscreen .lyrics-panel-body-row{grid-template-columns:minmax(0,1fr);}
              .lyrics-panel.fullscreen .lyrics-fs-sidebar{display:none;}
              .lyrics-panel.fullscreen .lyrics-panel-inner{padding-left:24px;padding-right:24px;}
            }
            @media (max-width:640px){
              .lyrics-panel.fullscreen{--lyrics-header-h:62px;--lyrics-player-safe:96px;}
              .lyrics-panel.fullscreen .lyrics-panel-header{padding:0 14px;}
              .lyrics-panel.fullscreen .lyrics-panel-inner{padding:14px 16px calc(var(--lyrics-player-safe) + env(safe-area-inset-bottom,0px));}
              .lyrics-panel.fullscreen .lyrics-pinned-top{margin-bottom:16px;padding:10px 12px;}
              .lyrics-panel.fullscreen .lyrics-line{scroll-margin-top:125px;scroll-margin-bottom:calc(var(--lyrics-player-safe) + 24px);}
            }
            @media (prefers-reduced-motion:reduce){
              .lyrics-panel.fullscreen .lyrics-panel-inner{scroll-behavior:auto;}
            }
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          path=Path('templates/index.html')
          text=path.read_text(encoding='utf-8')
          marker='/* NOMAD Lyrics v4 — viewport-safe layout correction.'
          if marker not in text:
              css=os.environ['LYRICS_LAYOUT_CSS']
              pos=text.rfind('</style>')
              if pos == -1:
                  raise SystemExit('No closing style tag found')
              text=text[:pos]+'\n  '+css.replace('\n','\n  ')+'\n'+text[pos:]
              path.write_text(text,encoding='utf-8')
          PY

      - name: Commit layout correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add templates/index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix(ui): stabilize fullscreen lyrics viewport layout"
          git push origin agent/nomad-vnext-foundation
